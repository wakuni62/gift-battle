<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ギフト読心バトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout concept: one stage column under a thin phase stepper, a fixed clock bar at the bottom.
   Four character colours (A–D) carry identity everywhere; ink-on-paper buttons, gold only for stars. */
:root{
  --font-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --bg:#EDEFF4; --surface:#FFFFFF; --surface2:#F4F5F9; --ink:#1B2033; --ink2:#586079; --line:#D6DAE6;
  --gold:#C98F00; --gold-soft:#FFF0C2; --good:#12795C; --good-soft:#DDF3EA; --warn:#B3361F;
  --c-a:#C23B5B; --c-a-soft:#FBE7EC;
  --c-b:#0E7F74; --c-b-soft:#DCF3EF;
  --c-c:#3A4DB8; --c-c-soft:#E4E8FB;
  --c-d:#A86D00; --c-d-soft:#FBEED0;
  --on-c:#FFFFFF; --shadow:0 1px 2px rgba(27,32,51,.06),0 6px 18px rgba(27,32,51,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11131C; --surface:#1A1D2A; --surface2:#222637; --ink:#ECEEF6; --ink2:#9AA1BA; --line:#2E3347;
    --gold:#F0B73A; --gold-soft:#3A2E0F; --good:#4CC9A0; --good-soft:#12332A; --warn:#FF8A73;
    --c-a:#F27C98; --c-a-soft:#3A2029; --c-b:#4CC3B5; --c-b-soft:#12332F;
    --c-c:#8F9EFF; --c-c-soft:#1F2449; --c-d:#F0B73A; --c-d-soft:#3B2E0F;
    --on-c:#14172A; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11131C; --surface:#1A1D2A; --surface2:#222637; --ink:#ECEEF6; --ink2:#9AA1BA; --line:#2E3347;
  --gold:#F0B73A; --gold-soft:#3A2E0F; --good:#4CC9A0; --good-soft:#12332A; --warn:#FF8A73;
  --c-a:#F27C98; --c-a-soft:#3A2029; --c-b:#4CC3B5; --c-b-soft:#12332F;
  --c-c:#8F9EFF; --c-c-soft:#1F2449; --c-d:#F0B73A; --c-d-soft:#3B2E0F;
  --on-c:#14172A; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 148px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3,p,ul,ol{margin:0}
h1,h2{text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seat-A{--c:var(--c-a);--cs:var(--c-a-soft)}
.seat-B{--c:var(--c-b);--cs:var(--c-b-soft)}
.seat-C{--c:var(--c-c);--cs:var(--c-c-soft)}
.seat-D{--c:var(--c-d);--cs:var(--c-d-soft)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:14px 8px}
.brand{font-family:var(--font-display);font-size:1.15rem;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:26px;height:20px;border-radius:4px;background:var(--gold);position:relative}
.brand i::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:4px;background:var(--bg)}
.top-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.82rem;color:var(--ink2);min-height:32px}
.chip b{color:var(--ink);font-weight:700}
.menu{position:absolute;right:0;top:40px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:230px;display:flex;flex-direction:column}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.92rem}
.menu button:hover{background:var(--surface2)}
.stepper{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:6px 0 22px}
.stepper li{font-size:.74rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:transparent}
.stepper li.done{background:var(--surface2)}
.stepper li.now{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}

/* type */
.eyebrow{font-size:.78rem;letter-spacing:.14em;color:var(--ink2);margin-bottom:6px}
.display{font-family:var(--font-display);font-weight:400;font-size:clamp(1.7rem,5.4vw,2.6rem);line-height:1.25;margin-bottom:10px}
h2.sub{font-family:var(--font-display);font-weight:400;font-size:1.25rem;margin:26px 0 10px}
.lead{max-width:44rem;color:var(--ink2);margin-bottom:18px}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.banner{margin:10px 0;padding:10px 14px;border-radius:10px;background:var(--gold-soft);border:1px solid var(--gold);font-size:.9rem}
.banner.err{background:transparent;border-color:var(--warn);color:var(--warn)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--ink);background:var(--surface);cursor:pointer;font-weight:700;font-size:.95rem}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:var(--line);font-weight:500}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.85rem}

/* cards */
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:14px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.chead{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--c);color:var(--on-c)}
.cletter{font-family:var(--font-display);font-size:1.6rem;line-height:1;width:38px;height:38px;border-radius:8px;border:2px solid currentColor;display:grid;place-items:center;flex:none}
.cname{font-family:var(--font-display);font-size:1.1rem;line-height:1.3}
.cjob{font-size:.78rem;line-height:1.4;opacity:.95}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.cbody h3{font-size:.78rem;letter-spacing:.06em;color:var(--ink2);font-weight:700;margin-top:6px}
.cbody h3 small{font-weight:400;margin-left:6px;letter-spacing:0}
.cbody p{line-height:1.6}
.cbody ol{padding-left:1.3rem;display:flex;flex-direction:column;gap:6px}
.secret{background:var(--cs);border-radius:10px;padding:10px 12px;margin-top:2px}
.cfoot{padding:0 14px 14px;margin-top:auto;display:flex;flex-direction:column;gap:8px}
.occ{display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.occ em{font-style:normal;font-weight:500;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--cs);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.card.big{max-width:560px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.panel h3{font-family:var(--font-display);font-weight:400;font-size:1.05rem;margin-bottom:6px}
.rules{padding-left:1.3rem;display:flex;flex-direction:column;gap:8px;max-width:46rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.status{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.status span{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.84rem}
.status span.ok{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.status span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--line))}
.turns{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0 0 14px}
.turns li{padding:4px 14px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;background:var(--surface);color:var(--ink2)}
.turns li b{font-family:var(--font-display);font-weight:400;margin-right:6px;color:var(--c)}
.turns li.now{background:var(--c);color:var(--on-c);border-color:var(--c)}
.turns li.now b{color:inherit}
.turns li.done{opacity:.55}
.phasebox{padding:12px 16px;border-radius:12px;background:var(--gold-soft);border:1px solid var(--gold);margin-bottom:14px;font-weight:500}

/* forms */
label{display:block;font-weight:700;font-size:.88rem;margin:12px 0 4px}
input[type=text],textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);line-height:1.6}
textarea{resize:vertical;min-height:84px}
.entry{max-width:30rem;margin:8px 0 0}
.entry .panel{margin-top:18px}

/* planning */
.plan-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.plan-grid{grid-template-columns:minmax(0,1fr)}}
.gift{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.gift p{font-weight:700;margin-bottom:10px}
.gift .lab{font-size:.74rem;letter-spacing:.08em;color:var(--ink2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:40px;padding:4px 14px;border-radius:999px;border:2px solid var(--c);background:var(--surface);cursor:pointer;font-weight:700;color:var(--ink)}
.pick[aria-pressed="true"]{background:var(--c);color:var(--on-c)}
.pick[disabled]{cursor:not-allowed;opacity:.6}
.notes{display:flex;flex-direction:column;gap:12px}

/* reveal & results */
.stars{font-size:1.25rem;letter-spacing:.1em;color:var(--gold)}
.stars .off{color:var(--line)}
.verdict{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-family:var(--font-display);font-size:1.1rem;flex:none}
.v2{background:var(--gold);color:#fff}
:root[data-theme="dark"] .v2{color:#14172A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .v2{color:#14172A}}
.v1{border:2px solid var(--ink)}
.v0{border:2px dashed var(--line);color:var(--ink2)}
.rcv{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.rcv .who{font-size:.78rem;font-weight:700;color:var(--c)}
.rcv p{font-weight:700}
.rcv small{display:block;color:var(--ink2);line-height:1.5}
.wish{padding:14px 16px;border-radius:12px;background:var(--cs);margin:10px 0 16px}
.wish b{display:block;font-size:.78rem;letter-spacing:.06em;color:var(--ink2);margin-bottom:2px}
.tot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:14px 0}
.tot .num{font-family:var(--font-display);font-size:2rem;line-height:1}
.tag{padding:3px 12px;border-radius:999px;font-weight:700;font-size:.85rem}
.tag.win{background:var(--good);color:#fff}
:root[data-theme="dark"] .tag.win{color:#0E1B16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.win{color:#0E1B16}}
.tag.lose{background:var(--surface2);border:1px solid var(--line)}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.strip span{padding:3px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.84rem}
.resultbanner{padding:18px 20px;border-radius:14px;margin:6px 0 14px;font-family:var(--font-display);font-size:1.35rem;line-height:1.4}
.resultbanner.win{background:var(--good);color:#fff}
:root[data-theme="dark"] .resultbanner.win{color:#0E1B16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .resultbanner.win{color:#0E1B16}}
.resultbanner.lose{background:var(--surface);border:1px solid var(--line)}
.rank{display:flex;align-items:center;gap:14px;margin:6px 0 14px;flex-wrap:wrap}
.rank .rk{font-family:var(--font-display);font-size:2.6rem;line-height:1;width:64px;height:64px;border-radius:14px;background:var(--gold);color:#fff;display:grid;place-items:center}
:root[data-theme="dark"] .rank .rk{color:#14172A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rank .rk{color:#14172A}}
.tablewrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;min-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;color:var(--ink2);font-weight:700}
td.cn b{color:var(--c)}
.bar-vote{height:10px;border-radius:5px;background:var(--c);min-width:4px}
.votes{display:grid;gap:8px;margin:8px 0}
.votes div{display:grid;grid-template-columns:7rem 1fr 3rem;gap:10px;align-items:center;font-size:.9rem}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:12px}
.board .card .cbody p{white-space:pre-wrap;overflow-wrap:anywhere}
.offer{padding:8px 10px;border-radius:8px;background:var(--surface2);font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.offer b{display:block;font-size:.74rem;color:var(--ink2)}
.sheet{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface2);border-radius:10px;padding:12px;font-size:.86rem;max-height:320px;overflow:auto}

/* clock bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.phase{min-width:0}
.phase b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.05rem;line-height:1.3}
.phase span{font-size:.8rem;color:var(--ink2)}
.clock{font-family:var(--font-display);font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.clock.over{color:var(--warn)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:560px){.clock{font-size:1.7rem}.bar-in{gap:8px 12px}}
@media (prefers-reduced-motion:no-preference){.btn,.pick{transition:background .15s,opacity .15s}}

/* game additions */
.gcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:10px 0}
.gc{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:84px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);font-weight:700;line-height:1.5;position:relative}
.gc .em{font-size:1.7rem;line-height:1.2;flex:none}
.gc .tx{min-width:0;overflow-wrap:anywhere}
.gc[aria-pressed="true"]{border-color:var(--c,var(--ink));background:var(--cs,var(--surface2))}
.gc.ro{cursor:default}
.gc.hit{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 3px var(--gold-soft)}
.gc.miss{opacity:.55}
.gc .who{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.gc .who i{font-style:normal;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--c);color:var(--on-c)}
.gc .mine{position:absolute;right:10px;top:-10px;font-size:.7rem;font-weight:700;background:var(--c,var(--ink));color:var(--on-c,var(--bg));padding:0 10px;border-radius:999px;line-height:1.6}
.evt{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);margin:0 0 14px}
.evt .die{font-size:3.2rem;line-height:1;display:inline-block}
.evt b{font-family:var(--font-display);font-weight:400;font-size:1.15rem;display:block;line-height:1.3}
.evt span{font-size:.9rem;opacity:.9}
@media (prefers-reduced-motion:no-preference){.evt .die.roll{animation:roll .9s cubic-bezier(.2,.8,.3,1) both}}
@keyframes roll{0%{transform:rotate(0) scale(.4);opacity:0}60%{transform:rotate(540deg) scale(1.15);opacity:1}100%{transform:rotate(720deg) scale(1)}}
.score{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.score span{display:inline-flex;align-items:baseline;gap:8px;padding:4px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--c);font-size:.85rem}
.score span.star{background:var(--c);color:var(--on-c)}
.score b{font-family:var(--font-display);font-weight:400;font-size:1.3rem;line-height:1.2}
.bubble{position:relative;padding:12px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--c);margin:10px 0 14px;font-weight:700}
.bubble small{display:block;color:var(--ink2);font-weight:400;font-size:.78rem}
.bets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0}
.bet{padding:10px 8px;border-radius:14px;border:2px solid var(--ink);background:var(--surface);cursor:pointer;font-weight:700;text-align:center;color:var(--ink)}
.bet b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.6rem;line-height:1.2}
.bet small{display:block;font-weight:400;font-size:.74rem;line-height:1.4;color:var(--ink2)}
.bet[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bet[aria-pressed="true"] small{color:inherit}
.bet[disabled],.gc[disabled]{cursor:not-allowed}
.rrow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.rrow .d{font-family:var(--font-display);font-size:1.5rem;line-height:1.1;min-width:3.2rem;text-align:right}
.rrow .d.pos{color:var(--good)}.rrow .d.neg{color:var(--warn)}
.rrow .who{font-size:.78rem;font-weight:700;color:var(--c)}
.rrow p{font-weight:700}
.joke{padding:12px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);margin-bottom:10px;text-align:left;width:100%;cursor:default;color:var(--ink)}
button.joke{cursor:pointer}
.joke .who{font-size:.78rem;font-weight:700;color:var(--c)}
.joke p{font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.joke.win{border-color:var(--gold);background:var(--gold-soft)}
.prompt{padding:14px 16px;border-radius:14px;background:var(--gold-soft);border:2px solid var(--gold);font-weight:700;font-size:1.1rem;margin:10px 0 14px}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.award{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.award .ic{font-size:2rem;line-height:1}
.award b{font-family:var(--font-display);font-weight:400}
.up{color:var(--good);font-weight:700}.down{color:var(--warn);font-weight:700}
</style>
</head>
<body>

<div class="wrap">
  <div id="top"></div>
  <div id="banner"></div>
  <main id="stage"></main>
</div>

    var row={seat:g,guess:guess,bet:bet,ok:false,delta:0,joke:gr.joke||''};

function stepIndex(){

  if(ph==='lobby'){return 0;}if(ph==='intro'){return 1;}
  if(order(ph)>=order('pick')&&order(ph)<=order('vote')){return 2+ROOM.round;}
  if(ph==='final'||ph==='finalrev'){return 6;}
  return 7;
}

function newRoom(gameNo){return {code:CODE,ver:2,hostId:ME.pid,gameNo:gameNo||1,phase:'lobby',phaseStartedAt:srvNow(),phaseDuration:0,round:0,revealIdx:0,meetUrl:'',createdAt:Date.now()};}

}
function selfHeal(){
  var m=me();if(!m||!ROOM||!joined){return;}
  if((m.gameNo!==ROOM.gameNo||!m.rd)&&healedFor!==ROOM.gameNo){
    healedFor=ROOM.gameNo;
    var f=freshPlayer(ROOM.gameNo);delete f.pid;delete f.name;delete f.joinedAt;delete f.seat;delete f.seatTs;
    saveMine(f,true);
  }
}
async function join(name,code){
  name=String(name||'').trim().slice(0,12);code=sanitizeCode(code);
  if(!name){banner('ニックネームを入力してください',true);return;}
  if(code.length<2){banner('ルームコードは英数字2文字以上で入力してください',true);return;}
  banner(null);
  ME.name=name;CODE=code;
  lsSet('gfq.last',JSON.stringify({name:name,code:code}));
  var roomRef=DB.doc('rooms/'+CODE);
  try{
    var snap=await roomRef.get(),d=snap.exists?snap.data():null;
    if(!d||!d.hostId||d.ver!==2){
      for(var t=0;t<4;t++){
        var l=await roomRef.acquire({holder:ME.pid,ttlMs:5000});
        snap=await roomRef.get();d=snap.exists?snap.data():null;
        if(d&&d.hostId&&d.ver===2){break;}
        if(l&&l.acquired){var g=((d&&d.gameNo)||0)+1;await roomRef.set(newRoom(g));d=newRoom(g);break;}
        await sleep(600);
      }
    }
    var gameNo=(d&&d.gameNo)||1;
    var pref=DB.doc('rooms/'+CODE+'/players/'+ME.pid),ps=await pref.get();
    if(ps.exists){await pref.update({name:name});}else{await pref.set(freshPlayer(gameNo));}
  }catch(e){if(e&&e.code==='net'){banner('接続できませんでした。ネット接続を確認して、もう一度「入室する」を押してください。',true);}else{writeError(e);}return;}
  joined=true;lastKey='';healedFor=null;lastGameNo=null;
  unsubs.push(roomRef.onSnapshot(onRoom,function(e){console.error(e);banner('ルームの読み込みに失敗しました',true);}));
  unsubs.push(DB.collection('rooms/'+CODE+'/players').onSnapshot(onPlayers,function(e){console.error(e);}));
  scheduleRender();
}
function onRoom(snap){
  if(!snap.exists){return;}
  var d=snap.data(),prev=lastGameNo;
  ROOM=d;lastGameNo=d.gameNo;
  if(prev!==null&&prev!==d.gameNo&&isHost()){reseedDummies();}
  selfHeal();scheduleRender();
}
function onPlayers(snap){
  var o={};snap.docs.forEach(function(ds){var v=ds.data();if(v){if(!v.pid){v.pid=ds.id;}o[v.pid]=v;}});
  PLAYERS=o;overlayPending();
  selfHeal();scheduleRender();
}
function leave(){
  unsubs.forEach(function(u){try{u();}catch(e){}});unsubs=[];
  joined=false;ROOM=null;PLAYERS={};lastKey='';menuOpen=false;lsDel('gfq.last');pend={};inflight={};
  scheduleRender();
}

/* ---------------- events ---------------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b){if(menuOpen){menuOpen=false;scheduleRender();}return;}
  if(b.disabled){return;}
  var act=b.getAttribute('data-act'),seat=b.getAttribute('data-seat');
  if(act==='menu'){menuOpen=!menuOpen;scheduleRender();return;}
  menuOpen=false;
  var r=ROOM?ROOM.round:0,m=me()||{},gr=rdOf(m,r),mine=mySeat(),ph=ROOM?ROOM.phase:'';
  if(act==='seat'&&ph==='lobby'){saveMine({seat:seat,seatTs:srvNow()},true);}
  else if(act==='unseat'&&ph==='lobby'){saveMine({seat:'',seatTs:0},true);}
  else if(act==='next'&&isHost()){advance();}
  else if(act==='extend'&&isHost()){roomUpdate({phaseDuration:(ROOM.phaseDuration||0)+60});}
  else if(act==='reset'&&isHost()){resetGame();}
  else if(act==='takeover'){roomUpdate({hostId:ME.pid});}
  else if(act==='leave'){leave();}
  else if(act==='save-meet'&&isHost()){var u=(document.getElementById('meet-url').value||'').trim();if(u&&!/^https:\/\//.test(u)){banner('URLは https:// から始めてください',true);}else{banner(null);roomUpdate({meetUrl:u});}}
  else if(act==='add-dummies'&&isHost()){addDummies();}
  else if(act==='remove-dummies'&&isHost()){removeDummies();}
  else if(act==='ready'){saveMine({ready:!m.ready},true);}
  else if(act==='pickgift'&&ph==='pick'&&mine===SEATS[r]&&!gr.locked){saveMine(rdPatch(r,{pick:Number(b.getAttribute('data-i'))}),true);}
  else if(act==='lie'&&ph==='pick'&&mine===SEATS[r]&&!gr.locked){saveMine(rdPatch(r,{lie:!gr.lie}),true);}
  else if(act==='lockpick'&&ph==='pick'&&mine===SEATS[r]&&gr.pick>=0){saveMine(rdPatch(r,{locked:true}),true);}
  else if(act==='unlockpick'&&ph==='pick'&&mine===SEATS[r]){saveMine(rdPatch(r,{locked:false}),true);}
  else if(act==='guessgift'&&ph==='guess'&&mine&&mine!==SEATS[r]&&!gr.gl){saveMine(rdPatch(r,{guess:Number(b.getAttribute('data-i'))}),true);}
  else if(act==='bet'&&ph==='guess'&&mine&&mine!==SEATS[r]&&!gr.gl){saveMine(rdPatch(r,{bet:Number(b.getAttribute('data-n'))}),true);}
  else if(act==='lockguess'&&ph==='guess'&&gr.guess>=0){saveMine(rdPatch(r,{gl:true}),true);}
  else if(act==='unlockguess'&&ph==='guess'){saveMine(rdPatch(r,{gl:false}),true);}
  else if(act==='jv'&&ph==='vote'&&mine===SEATS[r]&&!gr.jv){saveMine(rdPatch(r,{jv:seat}),true);}
  else if(act==='ffrac'&&ph==='final'&&mine&&!(m.fin&&m.fin.locked)){var f0=b.getAttribute('data-f');saveMine({fin:f0==='none'?{frac:f0,to:''}:{frac:f0}},true);}
  else if(act==='fto'&&ph==='final'&&mine&&!(m.fin&&m.fin.locked)){saveMine({fin:{to:seat}},true);}
  else if(act==='flock'&&ph==='final'&&mine){saveMine({fin:{locked:true}},true);}
  else if(act==='funlock'&&ph==='final'&&mine){saveMine({fin:{locked:false}},true);}
  else if(act==='copy-sheet'){copySheet();}
  else if(act==='save-sheet'){saveSheet();}
  scheduleRender();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='in-name'){entryDraft.name=t.value;return;}
  if(t.id==='in-code'){entryDraft.code=t.value;return;}
  var bind=t.getAttribute&&t.getAttribute('data-bind');
  if(bind){saveMine(nest(bind,t.value));}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='entry-form'){e.preventDefault();join(document.getElementById('in-name').value,document.getElementById('in-code').value);}
});
async function saveSheet(){
  var text=sheetText();
  try{
    var blob=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='gift-battle-result.txt';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);banner('保存しました');
  }catch(e){copySheet();}
}
async function copySheet(){
  var text=sheetText();
  try{await navigator.clipboard.writeText(text);banner('コピーしました');}
  catch(e){var el=document.getElementById('sheet-text');if(el){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}banner('コピーできませんでした。選択した文字を手動でコピーしてください',true);}
}

/* ---------------- init ---------------- */
async function init(){
  scheduleRender();
  USER=null;DL=null;
  if(typeof Peer!=='undefined'){DB=makeP2PDB();DB.onStatus=function(m){netMsg=m;scheduleRender();};}else{localMode=true;DB=makeMemDB();}
  var pid=lsGet('gfq.pid');
  if(!pid){pid='g'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);lsSet('gfq.pid',pid);}
  ME.pid=pid;
  var last=null;try{last=JSON.parse(lsGet('gfq.last')||'null');}catch(e){}
  if(last){entryDraft.name=last.name||'';entryDraft.code=last.code||'WOBS';}
  dbReady=true;lastKey='';scheduleRender();
  if(last&&last.name&&last.code&&canWrite){join(last.name,last.code);}
}
setInterval(tick,1000);
init();
window.__gfq={get room(){return ROOM;},get players(){return PLAYERS;},calc:calc,fcalc:fcalc,seated:seated,CH:CH};
})();
</script>
